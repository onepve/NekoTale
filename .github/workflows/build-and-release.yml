name: Build and Release NekoTale

on:
  push:
    branches: [ "main", "custom" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - name: Configure Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Mihomo Core
        run: |
          mkdir -p TMessagesProj/src/main/jniLibs/arm64-v8a
          cd core
          go mod tidy
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../TMessagesProj/src/main/jniLibs/arm64-v8a/libnekocore.so .
          ls -lh ../TMessagesProj/src/main/jniLibs/arm64-v8a/libnekocore.so

      - name: Configure Signing & Secrets
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC" >> ~/.gradle/gradle.properties
          echo "android.native.buildOutput=verbose" >> ~/.gradle/gradle.properties

          echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          
          # Default Telegram API ID if not explicitly provided
          API_ID="${{ secrets.API_ID }}"
          API_HASH="${{ secrets.API_HASH }}"
          echo "apiId=${API_ID:-2040}" >> local.properties
          echo "apiHash=${API_HASH:-b18441a1ff607e10a989891a5462e627}" >> local.properties
          echo "mapsApiKey=" >> local.properties
          echo "sentryDsn=" >> local.properties
          echo "helperBotId=0" >> local.properties
          echo "helperBotUsername=" >> local.properties

          # Decode Keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

          # Create placeholder google-services.json
          cat << 'EOF' > TMessagesProj_App/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "nekotale-app",
              "storage_bucket": "nekotale-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "com.nekotale.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForNekoTaleBuildPlaceholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # Create sentry.properties
          cat << 'EOF' > sentry.properties
          defaults.project=nekotale
          defaults.org=onepve
          EOF

      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prep
        run: |
          mkdir -p dist
          # Extract version from gradle.properties
          VER_NAME=$(grep "^APP_VERSION_NAME=" gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          VER_CODE=$(grep "^APP_VERSION_CODE=" gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "version_name=${VER_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VER_CODE}" >> $GITHUB_OUTPUT

          # Find release APK (prefer arm64-v8a)
          APK_PATH=$(find TMessagesProj_App/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find TMessagesProj_App/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" dist/NekoTale.apk

          # Generate version.json
          cat <<EOF > dist/version.json
          {
            "version": "${VER_NAME}",
            "versionCode": ${VER_CODE},
            "name": "猫猫物语 (NekoTale)",
            "downloadUrl": "https://dl.onepve.com/NekoTale/latest/NekoTale.apk",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          ENDPOINT_URL="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp dist/NekoTale.apk s3://downloads/NekoTale/latest/NekoTale.apk --endpoint-url "$ENDPOINT_URL" --cache-control "public, max-age=60, must-revalidate"
          aws s3 cp dist/version.json s3://downloads/NekoTale/latest/version.json --endpoint-url "$ENDPOINT_URL" --cache-control "public, max-age=60, must-revalidate"

      - name: Purge Cloudflare CDN Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            # Purge cache for onepve.com zone (11e721ee98e46e59da3e50fe90eef7ce)
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/11e721ee98e46e59da3e50fe90eef7ce/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"files":["https://dl.onepve.com/NekoTale/latest/NekoTale.apk","https://dl.onepve.com/NekoTale/latest/version.json"]}'
          fi

      - name: Auto Clean Old Caches, Artifacts, and Runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning old GitHub Actions caches..."
          gh cache list --repo "${{ github.repository }}" --limit 100 2>/dev/null | awk '{print $1}' | while read cid; do
            [ -n "$cid" ] && gh cache delete "$cid" --repo "${{ github.repository }}" 2>/dev/null || true
          done || true

          echo "Cleaning old workflow runs (keeping latest 2)..."
          gh run list --repo "${{ github.repository }}" --limit 50 --json databaseId,status 2>/dev/null | jq -r '.[] | select(.status == "completed") | .databaseId' | tail -n +3 | while read rid; do
            [ -n "$rid" ] && gh run delete "$rid" --repo "${{ github.repository }}" 2>/dev/null || true
          done || true
          echo "Cleanup completed."
